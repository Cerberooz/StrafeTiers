name: strafe-tiers
services:
  strafe-tiers:
    image: strafe-tiers:local
    build: .
    env_file: .env
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    # Outbound Discord Gateway connection. No public port or inbound webhook is needed.

  register:
    image: strafe-tiers:local
    build: .
    profiles: [setup]
    env_file: .env
    command: [node, scripts/register.mjs]
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
